spring.application.name=learn-spring-boot
logging.level.org.springframework=debug
spring.profiles.active=dev

currency-service.url=http://default1.in28minutes.com
currency-service.username=defaultusername
currency-service.key=defaultkey

# This will expose all the endpoints of the actuator
# management.endpoints.web.exposure.include=*

# use only the necessary endpoints of actuator because more the endpoint more the resource required(cpu, memory, etc)
management.endpoints.web.exposure.include=health, metrics
